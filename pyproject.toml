[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snaft"
version = "1.4.0"
description = "Semantic Network-Aware Firewall for Trust — behavioral firewall for AI agents. v1.4.0: airlock-runtime posture consumer (verdict.v1) + Firewall posture integration + posture-aware Rule.allow_iff_posture + always-on destructive-command blacklist (SNAFT-DESTRUCT-001)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Jasper van de Meent", email = "jasper@humotica.com"},
]
keywords = [
    "ai", "security", "firewall", "trust", "behavioral",
    "owasp", "owasp-llm", "owasp-agentic", "agentic-security",
    "llm", "agents", "provenance", "tibet", "eu-ai-act",
    "ainternet",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking :: Firewalls",
]

[project.optional-dependencies]
triage = ["tibet-triage>=0.1.0"]
sbom = ["tibet-sbom>=0.1.0"]
ainternet = ["ainternet>=0.4.0"]
tibet = ["tibet-core>=0.1.0"]
all = ["tibet-triage>=0.1.0", "tibet-sbom>=0.1.0", "ainternet>=0.4.0", "tibet-core>=0.1.0"]

[project.urls]
Homepage = "https://github.com/jaspertvdm/snaft"
Documentation = "https://github.com/jaspertvdm/snaft#readme"
Repository = "https://github.com/jaspertvdm/snaft"
Issues = "https://github.com/jaspertvdm/snaft/issues"

[project.scripts]
snaft = "snaft.cli:main"

[tool.hatch.build.targets.sdist]
include = ["/snaft"]

[tool.hatch.build.targets.wheel]
packages = ["snaft"]
